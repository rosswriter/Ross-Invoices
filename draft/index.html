<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>RossDraft</title>
<meta name="description" content="A simple, fast tree of notes, kept as Markdown files in your RossNotes folder.">
<meta name="theme-color" content="#FBF8F1">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="css/app.css?v=1.9.20">
<link rel="modulepreload" href="js/app.js?v=1.9.20">
<link rel="modulepreload" href="js/md.js?v=1.9.20">
<link rel="modulepreload" href="js/editor.js?v=1.9.20">
<link rel="modulepreload" href="js/store.js?v=1.9.20">
<style>
/* shown before anything else has loaded */
#busy.boot { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: #FBF8F1; color: #24211C;
  font: 17px system-ui, sans-serif; z-index: 100; }
@media (prefers-color-scheme: dark) { #busy.boot { background: #1F1E23; color: #E8E3D9; } }
#busy.boot .bar { position: fixed; top: 0; left: 0; right: 0; height: 4px; background: #2F5D8A; opacity: .35; }
</style>
</head>
<body>
<div id="spellbar" hidden></div>
<div id="busy" class="boot" role="status" aria-live="polite"><div class="bar"></div><span class="txt">Starting RossDraft…</span></div>
<div id="app">
  <header id="topbar">
    <button id="b-list" class="tbtn" title="Show or hide the note list (Ctrl+Alt+J)" aria-label="Show or hide the note list"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/></svg></button>
    <nav id="menubar" aria-label="Menus">
      <button data-menu="file"><u>F</u>ile</button>
      <button data-menu="edit"><u>E</u>dit</button>
      <button data-menu="insert"><u>I</u>nsert</button>
      <button data-menu="format">F<u>o</u>rmat</button>
      <button data-menu="notes"><u>N</u>otes</button>
      <button data-menu="view"><u>V</u>iew</button>
      <button data-menu="help"><u>H</u>elp</button>
    </nav>
    <div id="crumb" aria-label="Where you are"></div>
    <button id="b-cmd" title="Find a note or a command (Ctrl+K)"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><span class="lab">Find or do anything</span><kbd>Ctrl K</kbd></button>
    <button id="b-dark" class="tbtn" title="Light or dark (Ctrl+Shift+D)" aria-label="Light or dark"><svg class="moon" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5z"/></svg><svg class="sun" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5 19 19M5 19l1.5-1.5M17.5 6.5 19 5"/></svg></button>
  </header>
  <header id="toolbar" role="toolbar" aria-label="Formatting" hidden>
    <button id="b-new" class="tb" title="New note">New</button>
    <span class="sep"></span>
    <button data-cmd="bold" class="tb fmt" title="Bold (Ctrl+B)"><b>B</b></button>
    <button data-cmd="italic" class="tb fmt" title="Italic (Ctrl+I)"><i>I</i></button>
    <button data-cmd="underline" class="tb fmt" title="Underline (Ctrl+U)"><u>U</u></button>
    <button data-cmd="strike" class="tb fmt" title="Strikethrough (Ctrl+Shift+X)"><s>S</s></button>
    <button data-cmd="highlight" class="tb fmt hl" title="Highlight (Ctrl+Shift+H)">H</button>
    <span class="sep"></span>
    <button data-cmd="h1" class="tb" title="Heading 1 (Ctrl+1)"><b>H1</b></button>
    <button data-cmd="h2" class="tb" title="Heading 2 (Ctrl+2)"><b>H2</b></button>
    <button data-cmd="h3" class="tb" title="Heading 3 (Ctrl+3)"><b>H3</b></button>
    <button data-cmd="normal" class="tb" title="Normal text (Ctrl+Shift+N)">¶</button>
    <span class="sep"></span>
    <button data-cmd="ul" class="tb" title="Bullet list (Ctrl+Shift+8)">• List</button>
    <button data-cmd="ol" class="tb" title="Numbered list (Ctrl+Shift+7)">1. List</button>
    <button data-cmd="quote" class="tb" title="Indented quote (Ctrl+M)">❝ Quote</button>
    <span class="sep"></span>
    <button data-cmd="date" class="tb" title="Today's date (Ctrl+;)">Date</button>
    <button data-cmd="find" class="tb" title="Find and replace in this note (Ctrl+F, Ctrl+H)">Find</button>
    <button data-cmd="headings" class="tb" title="Go to a heading in this note (Ctrl+Shift+O)">Headings</button>
    <button data-cmd="picture" class="tb" title="Insert a picture or photo">Picture</button>
    <span class="sep"></span>
    <button data-cmd="undo" class="tb" title="Undo (Ctrl+Z)" aria-label="Undo">↶</button>
    <button data-cmd="redo" class="tb" title="Redo (Ctrl+Shift+Z)" aria-label="Redo">↷</button>
    <span class="sep"></span>
    <button data-cmd="smaller" class="tb" title="Smaller text (Ctrl+−)">A−</button>
    <button data-cmd="bigger" class="tb" title="Larger text (Ctrl+=)">A+</button>
    <button data-cmd="splith" class="tb" title="Split side by side (Ctrl+\)">Split ⇆</button>
    <button data-cmd="splitv" class="tb" title="Split top and bottom (Ctrl+Shift+\)">Split ⇅</button>
    <button data-cmd="dark" class="tb" title="Light / dark (Ctrl+Shift+D)" aria-label="Light or dark">☾</button>
    <button data-cmd="share" class="tb" title="Email or share this note">Share</button>
    <button data-cmd="print" class="tb" title="Print or save as PDF (Ctrl+P)">Print</button>
  </header>
  <div id="findbar" hidden>
    <input id="find-text" type="search" placeholder="Find in this note" autocomplete="off" enterkeyhint="search">
    <button id="find-prev" title="Previous (Shift+F3)">↑</button>
    <button id="find-next" title="Next (F3, Enter)">↓</button>
    <span id="find-count"></span>
    <input id="find-repl" type="text" placeholder="Replace with" autocomplete="off" enterkeyhint="go">
    <button id="find-one" title="Replace this one and go to the next">Replace</button>
    <button id="find-all" title="Replace every one in this note (Undo takes it all back)">Replace All</button>
    <label><input id="find-case" type="checkbox"> Match case</label>
    <label><input id="find-whole" type="checkbox"> Whole words</label>
    <select id="find-scope" title="Where to look"><option value="note">This note</option><option value="all">All notes</option></select>
    <button id="find-list" title="List every match (Ctrl+Shift+F)">List All</button>
    <button id="find-close" title="Close (Esc)">×</button>
  </div>
  <div id="main">
    <aside id="side">
      <div id="side-top">
        <input id="search" type="search" placeholder="Search the notes…" autocomplete="off">
        <div id="treebar">
          <button data-tree="new" title="New note after this one">+</button>
          <button data-tree="child" title="New note under this one">+›</button>
          <button data-tree="up" title="Move up (Alt+Up)">↑</button>
          <button data-tree="down" title="Move down (Alt+Down)">↓</button>
          <button data-tree="out" title="Move out a level (Alt+Left)">←</button>
          <button data-tree="in" title="Move under the note above (Alt+Right)">→</button>
          <button data-tree="delete" title="Delete the note (to the .trash folder)">🗑</button>
        </div>
      </div>
      <div id="tree" role="tree"></div>
      <div id="count"></div>
    </aside>
    <div id="divider" title="Drag to make the list wider or narrower"></div>
    <div id="panes">
      <section class="pane active" id="pane0">
        <div class="head"></div>
        <div class="scroller"><div id="page" class="page" contenteditable="true" spellcheck="true" autocapitalize="sentences"></div></div>
      </section>
      <div id="pdiv" title="Drag to change the sizes" hidden></div>
      <section class="pane" id="pane1" hidden>
        <div class="head"></div>
        <div class="scroller"><div id="page2" class="page" contenteditable="true" spellcheck="true" autocapitalize="sentences"></div></div>
      </section>
    </div>
  </div>
  <footer id="status">
    <span id="saved" aria-live="polite"></span>
    <span id="modes"></span>
    <span id="goal" hidden title="Today's words (click to change the target)"><svg width="22" height="22" viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="15" fill="none" stroke-width="5" class="track"/><circle cx="20" cy="20" r="15" fill="none" stroke-width="5" stroke-linecap="round" class="done" stroke-dasharray="94.25" stroke-dashoffset="94.25" transform="rotate(-90 20 20)"/></svg><span class="txt"></span></span>
    <div id="wc" title="Words (click for the details)"></div>
  </footer>
  <aside id="results" hidden><div class="rhead"><span class="rtitle"></span><button class="rclose" title="Close">×</button></div><div class="rlist"></div></aside>
  <div id="popnote" hidden><div class="phead"><span>Quick draft</span>
    <button type="button" class="pbtn pnew" title="A fresh draft (the one you were writing is kept)">New</button>
    <button type="button" class="pbtn pdrafts" title="The earlier drafts in Reminders">Drafts ▾</button>
    <button type="button" class="pbtn pins" title="Put this draft in the page at the cursor">Insert</button>
    <button class="pclose" title="Close (Ctrl+Alt+I)">×</button></div>
    <textarea spellcheck="true" lang="en-GB" placeholder="A quick draft…"></textarea><div class="plist" hidden></div></div>
  <div id="chip" hidden></div>
  <div id="fmtbar" role="toolbar" aria-label="Format the selection" hidden>
    <button data-cmd="bold" title="Bold (Ctrl+B)" aria-label="Bold"><b>B</b></button>
    <button data-cmd="italic" title="Italic (Ctrl+I)" aria-label="Italic"><i>I</i></button>
    <button data-cmd="underline" title="Underline (Ctrl+U)" aria-label="Underline"><u>U</u></button>
    <button data-cmd="highlight" class="hlb" title="Highlight (Ctrl+Shift+H)" aria-label="Highlight">H</button>
    <span class="fsep"></span>
    <button data-cmd="h2" title="Heading (Ctrl+2)" aria-label="Heading">H2</button>
    <button data-cmd="center" title="Centre (Ctrl+E)" aria-label="Centre"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M4 6h16M7 10h10M4 14h16M7 18h10"/></svg></button>
    <button data-cmd="clear" title="Clear formatting (Ctrl+Space)" aria-label="Clear formatting">✕</button>
  </div>
  <div id="menu" hidden></div>
  <div id="submenu" hidden></div>
  <div id="toast" hidden></div>
  <div id="dialog" hidden><div class="box"><h2></h2><div class="body"></div><button class="big main" id="dialog-close">Close</button></div></div>
</div>
<div id="start" hidden>
  <div class="card">
    <img src="icons/icon-192.png" alt="" width="72" height="72">
    <h1>RossDraft</h1>
    <p id="start-msg"></p>
    <div id="start-buttons"></div>
    <p class="small" id="start-note"></p>
  </div>
</div>
<input id="file-pic" type="file" accept="image/*" multiple hidden>
<input id="file-book" type="file" accept=".ncdb,.fnx" hidden>
<input id="file-docx" type="file" accept=".docx,application/vnd.openxmlformats-officedocument.wordprocessingml.document" hidden>
<div id="printdoc" class="page"></div>
<script type="module" src="js/app.js?v=1.9.20"></script>
</body>
</html>
